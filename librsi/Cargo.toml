[package]
name = "librsi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Peios userspace C ABI library for implementing a registry source (RSI provider)"

[lib]
# Produces librsi.so (cdylib) and librsi.a (staticlib).
name = "rsi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Shared C-ABI substrate: the global allocator, the errno slot, the syscall/ioctl
# wrappers, and the getxattr/builder helpers (shared with libpeios).
peios-cabi = { workspace = true }
# The LCS semantic core: RSI request parsers, status codes, the registry data model —
# the same pure (`core`-only) primitives from the pinned kernel revision.
# Userspace leaves the `kernel` feature off; qualification checks compatibility.
lcs-core = { workspace = true }
# Generated Rust mirror of the PKM kernel ABI (RSI constants + #[repr(C)] structs —
# the Rust analog of `#include <pkm/*.h>`). no_std, definitions only.
peios-uapi = { workspace = true }
# Raw libc FFI for the errno constants the entry points report, the source-device
# open/close, and the `abort` in the panic handler. no_std.
libc = { workspace = true }
