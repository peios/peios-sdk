[package]
name = "peios-cabi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared C-ABI substrate for the Peios userspace libraries (libpeios, librsi)"

[dependencies]
# Raw libc FFI: the malloc-backed global allocator, errno, and the syscall/ioctl
# wrappers. no_std, definitions only.
libc = { version = "0.2", default-features = false }

# Nothing may unwind across the C ABI boundary in the consuming cdylibs.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Its own workspace root (the consuming cdylibs — libpeios, librsi — are each their
# own workspace, and the kernel crates live in pkm/'s workspace).
[workspace]
